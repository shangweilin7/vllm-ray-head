name: vllm-ray-head

# eugr DGX-Spark optimized vLLM nightly (B12X build), pulled prebuilt.
# Prebuilt image includes Ray 2.58.0 (required by --distributed-executor-backend ray).
services:
  ray-head:
    image: eugr/spark-vllm-b12x:latest
    container_name: deepseek-v4-ray-head
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Fail Compose before creating a container when host networking is unset.
      NODE_IP: ${NODE_IP:?Set NODE_IP to this host's RoCE-reachable IP}
      HEAD_IP: ${HEAD_IP:?Set HEAD_IP to the Ray head's RoCE-reachable IP}
      ROCE_IFACE: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      NCCL_SOCKET_IFNAME: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      GLOO_SOCKET_IFNAME: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      VLLM_HOST_IP: ${NODE_IP}
      # eugr B12X serving-stack env; TP=2/PP=1 so no VLLM_PP_LAYER_PARTITION.
      # B12X backends are selected by the --moe/--linear/--attention-backend
      # flags; the old VLLM_USE_B12X_* / B12X_* recipe env vars are not read by
      # this image and were removed.
      CUTE_DSL_ARCH: sm_121a
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_MOE_SKIP_PADDING: "0"
      RAY_ADDRESS: ${HEAD_IP}:6379
      RAY_memory_monitor_refresh_ms: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${HOST_HOME:?Set HOST_HOME to this host's home directory}/.cache/huggingface:/root/.cache/huggingface
      # vLLM runtime cache lives inside this repo dir (gitignored, ./vllm-cache),
      # so the cache travels with the project and no longer sits in $HOME.
      - ./vllm-cache:/root/.cache/vllm
      # JIT/autotune caches must survive container recreation; otherwise
      # b12x/Triton/TileLang recompile on every recreate (~7-10 min startup).
      - ./compile-cache/b12x:/root/.cache/b12x
      - ./compile-cache/triton:/root/.triton
      - ./compile-cache/tilelang:/root/.tilelang
      - ./compile-cache/torch_extensions:/root/.cache/torch_extensions
      - ./compile-cache/flashinfer:/root/.cache/flashinfer
      - ./start-head-and-vllm.sh:/usr/local/bin/start-head-and-vllm.sh:ro
    entrypoint:
      - /usr/local/bin/start-head-and-vllm.sh
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
