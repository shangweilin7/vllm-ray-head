name: vllm-ray-head

# Official vLLM v0.28.0 multi-arch manifest, pinned for reproducibility.
services:
  ray-head:
    # Derived solely from the pinned official image; adds the Ray dependency
    # required by --distributed-executor-backend ray.
    image: vllm-openai-ray:v0.28.0-ray2.58.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseek-v4-ray-head
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Fail Compose before creating a container when host networking is unset.
      NODE_IP: ${NODE_IP:?Set NODE_IP to this host's RoCE-reachable IP}
      HEAD_IP: ${HEAD_IP:?Set HEAD_IP to the Ray head's RoCE-reachable IP}
      ROCE_IFACE: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      NCCL_SOCKET_IFNAME: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      GLOO_SOCKET_IFNAME: ${ROCE_IFACE:?Set ROCE_IFACE to the RoCE NIC name}
      VLLM_HOST_IP: ${NODE_IP}
      RAY_ADDRESS: ${HEAD_IP}:6379
      RAY_memory_monitor_refresh_ms: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/vllm-cache:/root/.cache/vllm
      - ./start-head-and-vllm.sh:/usr/local/bin/start-head-and-vllm.sh:ro
    entrypoint:
      - /usr/local/bin/start-head-and-vllm.sh
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
