name: vllm-ray-head

services:
  ray-head:
    image: vllm-openai-ray:v0.27.1-sm121-dspark
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseek-v4-ray-head
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all

    cap_add:
      - IPC_LOCK

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NODE_IP: ${NODE_IP}
      HEAD_IP: ${HEAD_IP}
      ROCE_IFACE: ${ROCE_IFACE}
      NCCL_SOCKET_IFNAME: ${ROCE_IFACE}
      GLOO_SOCKET_IFNAME: ${ROCE_IFACE}
      VLLM_HOST_IP: ${NODE_IP}
      RAY_ADDRESS: ${HEAD_IP}:6379
      RAY_memory_monitor_refresh_ms: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # Required on SM121: retain DeepGEMM; never set VLLM_USE_DEEP_GEMM=0.
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_DEEP_GEMM_WARMUP: full
      PP_PARTITION: ${PP_PARTITION}

    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/vllm-cache:/root/.cache/vllm
      - ./start-head-and-vllm.sh:/usr/local/bin/start-head-and-vllm.sh:ro

    entrypoint:
      - /usr/local/bin/start-head-and-vllm.sh

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
